<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>NEON HYPER-SNAKE 3000</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #0ff;
            text-shadow: 0 0 10px #0ff; font-size: 24px; pointer-events: none;
        }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; background: rgba(0,0,0,0.8); color: white;
            transition: opacity 0.5s; z-index: 10;
        }
        h1 { font-size: 60px; margin: 0; color: #0ff; text-shadow: 0 0 20px #0ff; letter-spacing: 5px; }
        p { font-size: 20px; margin-bottom: 30px; }
        button {
            padding: 15px 40px; font-size: 20px; background: transparent;
            border: 2px solid #0ff; color: #0ff; cursor: pointer;
            transition: 0.3s; text-transform: uppercase; box-shadow: 0 0 15px #0ff;
        }
        button:hover { background: #0ff; color: #000; }
    </style>
</head>
<body>

    <div id="ui">SCORE: <span id="score">0</span></div>
    
    <div id="overlay">
        <h1>HYPER SNAKE</h1>
        <p>Керуй стрілками або WASD. Поглинай неонові сфери.</p>
        <button onclick="startGame()">ЗАПУСТИТИ ПРИВІД</button>
    </div>

    <!-- Підключаємо Three.js з CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, snake = [], food, direction = {x: 1, z: 0};
        let nextDirection = {x: 1, z: 0};
        let score = 0;
        let gameActive = false;
        let clock = new THREE.Clock();
        let moveTimer = 0;
        const MOVE_SPEED = 0.15; // Чим менше, тим повільніше змійка
        const GRID_SIZE = 20;

        function init() {
            // Сцена та Камера
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000015, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 15);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000005);
            document.body.appendChild(renderer.domElement);

            // Світло
            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0x00ffff, 1, 100);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            // Створення "Сітки" підлоги (кібер-простір)
            const gridHelper = new THREE.GridHelper(GRID_SIZE * 2, GRID_SIZE, 0x00ffff, 0x004444);
            scene.add(gridHelper);

            // Створення зірок на фоні
            const starGeometry = new THREE.BufferGeometry();
            const starMaterial = new THREE.PointsMaterial({color: 0xffffff});
            const starVertices = [];
            for (let i = 0; i < 5000; i++) {
                starVertices.push((Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100);
            }
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);

            // Початкова змійка (голова)
            createSnakePart(0, 0);
            
            // їжа
            spawnFood();

            window.addEventListener('keydown', handleInput);
            window.addEventListener('resize', onWindowResize);
        }

        function createSnakePart(x, z) {
            const geo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
            const mat = new THREE.MeshPhongMaterial({ 
                color: snake.length === 0 ? 0x00ffff : 0x0088ff, 
                emissive: snake.length === 0 ? 0x00ffff : 0x0044ff,
                shininess: 100 
            });
            const part = new THREE.Mesh(geo, mat);
            part.position.set(x, 0.5, z);
            scene.add(part);
            snake.push(part);
        }

        function spawnFood() {
            if (food) scene.remove(food);
            const geo = new THREE.SphereGeometry(0.4, 16, 16);
            const mat = new THREE.MeshPhongMaterial({ color: 0xff00ff, emissive: 0xff00ff });
            food = new THREE.Mesh(geo, mat);
            food.position.set(
                Math.floor(Math.random() * GRID_SIZE) - GRID_SIZE/2 + 0.5,
                0.5,
                Math.floor(Math.random() * GRID_SIZE) - GRID_SIZE/2 + 0.5
            );
            scene.add(food);
        }

        function handleInput(e) {
            switch(e.key.toLowerCase()) {
                case 'arrowup': case 'w': if (direction.z !== 1) nextDirection = {x: 0, z: -1}; break;
                case 'arrowdown': case 's': if (direction.z !== -1) nextDirection = {x: 0, z: 1}; break;
                case 'arrowleft': case 'a': if (direction.x !== 1) nextDirection = {x: -1, z: 0}; break;
                case 'arrowright': case 'd': if (direction.x !== -1) nextDirection = {x: 1, z: 0}; break;
            }
        }

        function update() {
            if (!gameActive) return;

            moveTimer += clock.getDelta();
            if (moveTimer > MOVE_SPEED) {
                moveTimer = 0;
                direction = nextDirection;

                // Зберігаємо позицію хвоста для наступного сегмента
                const prevPos = snake[snake.length - 1].position.clone();
                
                // Рухаємо кожен сегмент за попереднім
                for (let i = snake.length - 1; i > 0; i--) {
                    snake[i].position.copy(snake[i-1].position);
                }

                // Рух голови
                const head = snake[0];
                head.position.x += direction.x;
                head.position.z += direction.z;

                // Перевірка зіткнення з їжею
                if (head.position.distanceTo(food.position) < 1) {
                    score++;
                    document.getElementById('score').innerText = score;
                    createSnakePart(prevPos.x, prevPos.z);
                    spawnFood();
                    // Прискоримо гру трохи
                }

                // Перевірка зіткнення з собою
                for (let i = 1; i < snake.length; i++) {
                    if (head.position.distanceTo(snake[i].position) < 0.5) gameOver();
                }

                // Перевірка виходу за межі
                if (Math.abs(head.position.x) > GRID_SIZE/2 + 1 || Math.abs(head.position.z) > GRID_SIZE/2 + 1) {
                    gameOver();
                }
            }

            // Анімація камери та їжі для "соковитості"
            const time = Date.now() * 0.002;
            food.position.y = 0.5 + Math.sin(time) * 0.2;
            camera.position.x = Math.sin(time * 0.1) * 2;
            camera.lookAt(snake[0].position);
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('overlay').style.opacity = '1';
            document.getElementById('overlay').style.pointerEvents = 'all';
            document.querySelector('h1').innerText = "КРАХ СИСТЕМИ";
            document.querySelector('p').innerText = `Ваш рахунок: ${score}. Ви були стерті з простору.`;
        }

        function startGame() {
            // Очищення старої гри
            snake.forEach(part => scene.remove(part));
            snake = [];
            score = 0;
            document.getElementById('score').innerText = "0";
            direction = {x: 1, z: 0};
            nextDirection = {x: 1, z: 0};
            
            createSnakePart(0, 0);
            spawnFood();
            
            document.getElementById('overlay').style.opacity = '0';
            document.getElementById('overlay').style.pointerEvents = 'none';
            gameActive = true;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
